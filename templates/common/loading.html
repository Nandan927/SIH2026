<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Horizon — Update Your Future</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:       #fafafc;
    --bg-2:     #f4f2ee;
    --slate:    #0f172a;
    --slate-2:  #1e293b;
    --slate-3:  #475569;
    --yellow:   #f59e0b;
    --yellow-2: #fbbf24;
    --orange:   #ea580c;
    --orange-2: #f97316;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--slate);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ═══ ambient background glow — subtle warm washes on white ═══ */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 50%, rgba(245, 158, 11, 0.09) 0%, transparent 65%),
      radial-gradient(ellipse 40% 30% at 20% 25%, rgba(234, 88, 12, 0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 82% 78%, rgba(251, 191, 36, 0.07) 0%, transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #fafafc 55%, #f6f4ef 100%);
  }

  /* ═══ soft edge fade — replaces dark vignette ═══ */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse 95% 85% at 50% 50%, transparent 55%, rgba(120, 100, 70, 0.055) 100%);
  }

  /* ═══ canvas ═══ */
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 2;
    opacity: 0;
    animation: canvasIn 1.6s 0.05s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes canvasIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ═══ layout ═══ */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: grid;
    grid-template-rows: 1fr auto;
    pointer-events: none;
  }

  /* ── centered brand ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    transform: translateY(-2vh);
  }

  .brand {
    opacity: 0;
    animation: brandIn 1.4s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  .brand h1 {
    font-family: "Poppins", sans-serif;
    font-size: clamp(56px, 11vw, 132px);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 0.95;
    /* dark slate core with warm orange→yellow under-glow, legible on white */
    background: linear-gradient(
      135deg,
      #1e293b 0%,
      #2a2417 20%,
      #d97706 62%,
      #ea580c 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.9))
            drop-shadow(0 8px 22px rgba(234, 88, 12, 0.18))
            drop-shadow(0 0 44px rgba(245, 158, 11, 0.20));
  }

  .brand .sub {
    margin-top: 18px;
    font-family: "Inter", sans-serif;
    font-size: clamp(10px, 1.1vw, 12px);
    font-weight: 600;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: var(--slate-3);
  }

  .brand .rule {
    width: 42px;
    height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--yellow), var(--orange), transparent);
    opacity: 0.9;
  }

  @keyframes brandIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── bottom loader ── */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 0 24px 44px;
    opacity: 0;
    animation: loaderIn 1.2s 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes loaderIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dots {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd580, var(--yellow));
    box-shadow:
      0 1px 2px rgba(180, 83, 9, 0.28),
      0 0 0 1px rgba(180, 83, 9, 0.10),
      0 0 14px rgba(245, 158, 11, 0.35);
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  .dots span:nth-child(2) {
    background: radial-gradient(circle at 35% 30%, #ffdc8a, var(--yellow-2));
    box-shadow:
      0 1px 2px rgba(180, 83, 9, 0.28),
      0 0 0 1px rgba(180, 83, 9, 0.10),
      0 0 14px rgba(251, 191, 36, 0.42);
    animation-delay: 0.18s;
  }
  .dots span:nth-child(3) {
    background: radial-gradient(circle at 35% 30%, #ff9a5c, var(--orange-2));
    box-shadow:
      0 1px 2px rgba(154, 52, 18, 0.30),
      0 0 0 1px rgba(154, 52, 18, 0.10),
      0 0 14px rgba(249, 115, 22, 0.40);
    animation-delay: 0.36s;
  }
  .dots span:nth-child(4) {
    background: radial-gradient(circle at 35% 30%, #ff7a4a, var(--orange));
    box-shadow:
      0 1px 2px rgba(154, 52, 18, 0.34),
      0 0 0 1px rgba(154, 52, 18, 0.12),
      0 0 14px rgba(234, 88, 12, 0.45);
    animation-delay: 0.54s;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(0.82); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  .loader .txt {
    font-family: "Inter", sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--slate-2);
    animation: txtBreathe 2.6s ease-in-out infinite;
  }
  @keyframes txtBreathe {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
  }

  /* ── top mark ── */
  .corner {
    position: fixed;
    top: 22px;
    left: 26px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: "Poppins", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.24em;
    color: var(--slate-2);
    opacity: 0;
    animation: cornerIn 1.2s 0.9s ease forwards;
  }
  .corner::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    box-shadow:
      0 1px 2px rgba(154, 52, 18, 0.25),
      0 0 12px rgba(245, 158, 11, 0.55);
    animation: cornerPulse 2s ease-in-out infinite;
  }
  @keyframes cornerIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes cornerPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(245, 158, 11, 0.45); }
    50%      { transform: scale(1.18); box-shadow: 0 0 18px rgba(245, 158, 11, 0.75); }
  }

  .corner-right {
    position: fixed;
    top: 22px;
    right: 26px;
    z-index: 5;
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--slate-3);
    opacity: 0;
    animation: cornerIn 1.2s 1s ease forwards;
  }

  @media (max-width: 640px) {
    .center { transform: translateY(-1vh); }
    .brand .sub { letter-spacing: 0.4em; text-indent: 0.4em; }
    .loader { padding-bottom: 34px; gap: 14px; }
    .corner, .corner-right { font-size: 9px; }
    .corner { left: 20px; }
    .corner-right { right: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="ambient"></div>

<canvas id="scene" aria-hidden="true"></canvas>

<div class="vignette"></div>

<div class="corner">HORIZON</div>
<div class="corner-right">v2.0 · Live</div>

<div class="stage">
  <div class="center">
    <div class="brand">
      <h1>Horizon</h1>
      <div class="sub">Update Your Future</div>
      <div class="rule"></div>
    </div>
  </div>

  <div class="loader">
    <div class="dots">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="txt">Analyzing Skills…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

(() => {
  'use strict';

  // ═══════════════════════════════════════════════════════════
  //  Renderer & scene
  // ═══════════════════════════════════════════════════════════
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance',
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  // clear to fully transparent so CSS background shows through
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);

  // ═══════════════════════════════════════════════════════════
  //  Lights — for a light background, we lean on ambient +
  //  brighter point lights, and ditch additive blending so the
  //  geometry reads as solid, saturated color (not glow).
  // ═══════════════════════════════════════════════════════════
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));

  const lightY = new THREE.PointLight(0xf59e0b, 1.1, 30, 2);
  lightY.position.set(3, 3, 4);
  scene.add(lightY);

  const lightO = new THREE.PointLight(0xea580c, 0.9, 30, 2);
  lightO.position.set(-3.5, -2, 3);
  scene.add(lightO);

  // ═══════════════════════════════════════════════════════════
  //  Root group — receives cursor tilt
  // ═══════════════════════════════════════════════════════════
  const root = new THREE.Group();
  root.scale.setScalar(0.7);
  scene.add(root);

  // ── outer icosahedron wireframe (amber) ──
  const outerGeo = new THREE.IcosahedronGeometry(1.9, 1);
  const outerWire = new THREE.LineSegments(
    new THREE.WireframeGeometry(outerGeo),
    new THREE.LineBasicMaterial({
      color: 0xd97706,        // deeper amber — visible on white
      transparent: true,
      opacity: 0.55,
      // NORMAL blending (default) — additive would be invisible on white
    })
  );
  root.add(outerWire);

  // ── inner icosahedron wireframe (orange) ──
  const innerGeo = new THREE.IcosahedronGeometry(1.35, 0);
  const innerWire = new THREE.LineSegments(
    new THREE.WireframeGeometry(innerGeo),
    new THREE.LineBasicMaterial({
      color: 0xea580c,        // deep orange
      transparent: true,
      opacity: 0.85,
    })
  );
  root.add(innerWire);

  // ═══════════════════════════════════════════════════════════
  //  Skill-node network — vertices of outer icosahedron,
  //  connected to 3 nearest neighbors with warm-yellow lines.
  // ═══════════════════════════════════════════════════════════
  const positions = outerGeo.attributes.position;
  const uniqueVerts = [];
  const seen = new Set();
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    const key = `${x.toFixed(3)}|${y.toFixed(3)}|${z.toFixed(3)}`;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueVerts.push(new THREE.Vector3(x, y, z));
    }
  }

  const edgePositions = [];
  for (let i = 0; i < uniqueVerts.length; i++) {
    const v = uniqueVerts[i];
    const near = [];
    for (let j = 0; j < uniqueVerts.length; j++) {
      if (i === j) continue;
      near.push({ idx: j, d: v.distanceToSquared(uniqueVerts[j]) });
    }
    near.sort((a, b) => a.d - b.d);

    for (let k = 0; k < Math.min(3, near.length); k++) {
      const j = near[k].idx;
      if (i < j) {
        const u = uniqueVerts[j];
        edgePositions.push(v.x, v.y, v.z, u.x, u.y, u.z);
      }
    }
  }

  const networkGeo = new THREE.BufferGeometry();
  networkGeo.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(edgePositions, 3)
  );
  const network = new THREE.LineSegments(
    networkGeo,
    new THREE.LineBasicMaterial({
      color: 0xf59e0b,        // amber
      transparent: true,
      opacity: 0.75,
    })
  );
  root.add(network);

  // ── soft circular dot texture (used for nodes + particles) ──
  function makeDotTexture() {
    const size = 64;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    // for the light theme we use a solid warmer core (no additive glow)
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0.00, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.25, 'rgba(255, 226, 178, 1)');
    g.addColorStop(0.55, 'rgba(245, 158, 11, 0.95)');
    g.addColorStop(0.85, 'rgba(234, 88, 12, 0.55)');
    g.addColorStop(1.00, 'rgba(234, 88, 12, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const dotTex = makeDotTexture();

  // ── nodes — points at every icosahedron vertex ──
  const nodePositions = [];
  for (const v of uniqueVerts) {
    nodePositions.push(v.x, v.y, v.z);
  }
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(nodePositions, 3)
  );
  const nodes = new THREE.Points(
    nodeGeo,
    new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.22,
      sizeAttenuation: true,
      transparent: true,
      opacity: 1.0,
      map: dotTex,
      depthWrite: false,
    })
  );
  root.add(nodes);

  // ── core pulse — small glowing sphere in the middle ──
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xea580c,
    transparent: true,
    opacity: 0.9,
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), coreMat);
  root.add(core);

  // ── distant particles (ambient depth) ──
  const PARTICLE_COUNT = 500;
  const pPositions = new Float32Array(PARTICLE_COUNT * 3);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const r = 2.4 + Math.random() * 1.0;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pPositions[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
    pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pPositions[i * 3 + 2] = r * Math.cos(phi);
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  const particles = new THREE.Points(
    pGeo,
    new THREE.PointsMaterial({
      color: 0xf59e0b,
      size: 0.055,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.75,
      map: dotTex,
      depthWrite: false,
    })
  );
  root.add(particles);

  // ═══════════════════════════════════════════════════════════
  //  Cursor parallax
  // ═══════════════════════════════════════════════════════════
  const mouse = { x: 0, y: 0 };
  const tilt  = { x: 0, y: 0 };

  function onPointerMove(clientX, clientY) {
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = (clientY / window.innerHeight) * 2 - 1;
  }

  window.addEventListener('pointermove', (e) => onPointerMove(e.clientX, e.clientY), { passive: true });
  window.addEventListener('pointerleave', () => { mouse.x = 0; mouse.y = 0; });

  let idlePhase = 0;

  // ═══════════════════════════════════════════════════════════
  //  Resize
  // ═══════════════════════════════════════════════════════════
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const aspect = w / h;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false);

    camera.aspect = aspect;
    camera.position.z = aspect < 0.9 ? 7.4 : aspect < 1.3 ? 6.6 : 6.0;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ═══════════════════════════════════════════════════════════
  //  Animation loop
  // ═══════════════════════════════════════════════════════════
  const clock = new THREE.Clock();
  let entryT = 0;
  const ENTRY_DURATION = 1.6;

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rotationSpeed = prefersReduced ? 0.0 : 1.0;

  function tick() {
    const dt = Math.min(0.05, clock.getDelta());
    const t = clock.getElapsedTime();

    if (entryT < 1) {
      entryT = Math.min(1, entryT + dt / ENTRY_DURATION);
      const ease = 1 - Math.pow(1 - entryT, 3);
      root.scale.setScalar(0.7 + 0.3 * ease);
    }

    const targetX = mouse.y * 0.55;
    const targetY = mouse.x * 0.85;
    tilt.x += (targetX - tilt.x) * 0.06;
    tilt.y += (targetY - tilt.y) * 0.06;

    idlePhase += dt * 0.35;
    const driftX = Math.sin(idlePhase) * 0.06;
    const driftY = Math.cos(idlePhase * 0.7) * 0.08;

    root.rotation.x = tilt.x + driftX;
    root.rotation.y = tilt.y + driftY;
    root.position.x = tilt.y * 0.22;
    root.position.y = -tilt.x * 0.18 + Math.sin(t * 0.9) * 0.07;

    outerWire.rotation.y += dt * 0.16 * rotationSpeed;
    outerWire.rotation.x += dt * 0.05 * rotationSpeed;

    innerWire.rotation.y -= dt * 0.26 * rotationSpeed;
    innerWire.rotation.z += dt * 0.10 * rotationSpeed;

    network.rotation.y += dt * 0.10 * rotationSpeed;
    network.rotation.z -= dt * 0.045 * rotationSpeed;

    particles.rotation.y += dt * 0.045 * rotationSpeed;
    particles.rotation.x += dt * 0.02 * rotationSpeed;

    const pulse = 0.9 + Math.sin(t * 2.4) * 0.35;
    core.scale.setScalar(pulse);
    coreMat.opacity = 0.55 + Math.sin(t * 2.4) * 0.35;

    lightY.position.x = Math.cos(t * 0.4) * 3.2;
    lightY.position.z = Math.sin(t * 0.4) * 3.2 + 2;
    lightO.position.x = Math.cos(t * 0.3 + 2.0) * 3.5;
    lightO.position.z = Math.sin(t * 0.3 + 2.0) * 3.0 + 2;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('pagehide', () => {
    renderer.dispose();
  });
})();
</script>
</body>
</html>
